version: '3'

services:
  db:
    image: mariadb:10
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - dvwa-db:/var/lib/mysql

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    restart: always
    environment:
      - DB_SERVER=db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
      - DEFAULT_SECURITY_LEVEL=low
      - DISABLE_AUTHENTICATION=true
    depends_on:
      - db

  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      - PARANOIA=${PARANOIA:-1}
      - ANOMALY_INBOUND=${ANOMALY_INBOUND:-5}
      - ANOMALY_OUTBOUND=${ANOMALY_OUTBOUND:-6}
      - BACKEND=http://dvwa:80
      - MODSEC_AUDIT_ENGINE=On
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG=/var/log/modsecurity/audit.log
    ports:
      - "7979:8080"
    volumes:
      - ./waf-error.conf:/etc/nginx/templates/includes/location_common.conf.template
      - ./modsec-logs:/var/log/modsecurity
    depends_on:
      - dvwa

  dvwa-direct:
    image: nginx:alpine
    ports:
      - "7978:80"
    volumes:
      - ./nginx-nowaf.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - dvwa

  setup:
    image: curlimages/curl
    volumes:
      - ./setup-dvwa.sh:/setup-dvwa.sh
    command: /setup-dvwa.sh
    depends_on:
      - dvwa

volumes:
  dvwa-db:
