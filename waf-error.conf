error_page 403 @403_json;

location @403_json {
    default_type text/html;
    return 403 '<html>
<head><title>403 Forbidden - ModSecurity WAF</title></head>
<body>
<center><h1>403 Forbidden</h1></center>
<hr>
<center><p>Request blocked by ModSecurity WAF</p></center>
<center><p><b>Request ID:</b> $request_id</p></center>
<center><p>Check the WAF logs for rule details:</p></center>
<center><pre>docker compose logs waf</pre></center>
<center><p>Or inspect the audit log mounted at <code>./modsec-logs/audit.log</code></p></center>
</body>
</html>';
}
